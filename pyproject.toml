[project]
name = "auditor-dualstack"
version = "0.6.0"
description = "Prototipo multi-agente orquestado basado en LLMs para auditorías de ciberseguridad en entornos dual-stack IPv4/IPv6"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Hector Yonaiker Antolinez Rojas" },
    { name = "Jose Fernando Galvan Payares" },
]
dependencies = [
    "langgraph>=0.2.28",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.2.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    # Herramientas de red. Scapy instala en Windows pero el envío de paquetes
    # IPv6 crudos (NDP/fragmentación) solo funciona con root en Kali/Linux.
    "scapy>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]
obs = [
    # Capa de observabilidad (RF-09). Se activa en el incremento 5.
    "arize-phoenix>=4.0",
    "openinference-instrumentation-langchain>=0.1",
]

[project.scripts]
auditor = "auditor_dualstack.cli:main"

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
