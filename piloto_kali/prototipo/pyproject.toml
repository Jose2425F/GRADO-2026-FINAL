[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditoria-dualstack"
version = "0.5.0"
description = "Prototipo controlado de auditoria dual-stack para laboratorio"
requires-python = ">=3.13,<3.14"
dependencies = [
  "langgraph==1.2.12",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "jinja2>=3.1,<4",
  "reportlab>=4,<5",
  "paramiko>=3.5,<5",
  "psycopg[binary]>=3.2,<4",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
ipv6 = ["scapy>=2.7,<3"]
test = ["pytest>=8,<10"]

[project.scripts]
auditoria = "auditoria.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auditoria = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
